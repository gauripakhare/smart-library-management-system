<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - Delete Student</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="src/css/admin-sidebar.css">
  <link rel="stylesheet" href="src/css/delete-student.css">
</head>
<body>
  <div class="layout-container">
    <!-- Admin Sidebar Mount -->
    <div id="sidebar-placeholder"></div>

    <div class="main-wrapper">
      <!-- Topbar Header -->
      <header class="topbar">
        <div class="topbar-right">
          <div class="admin-dropdown" id="admin-profile-toggle">
            <div class="user-avatar-circle">
              <i class="fa-solid fa-user"></i>
            </div>
            <span class="admin-name" id="admin-username">Admin</span>
            <i class="fa-solid fa-chevron-down dropdown-arrow"></i>
          </div>
        </div>
      </header>

      <!-- Main Workspace -->
      <main class="page-content">
        <!-- Page Title & Breadcrumb -->
        <section class="page-header">
          <div class="title-with-icon">
            <a href="student-management.html" class="back-link-icon" title="Go back">
              <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="page-title">Delete Student</h2>
          </div>
          <nav class="breadcrumb-nav">
            <a href="dashboard.html"><i class="fa-solid fa-house"></i></a>
            <span class="separator">&gt;</span>
            <a href="student-management.html">Student Management</a>
            <span class="separator">&gt;</span>
            <span class="current">Delete Student</span>
          </nav>
        </section>

        <!-- Outer Content Canvas -->
        <div class="delete-canvas">
          <!-- Main Centered Delete Card -->
          <div class="delete-card">
            <div class="delete-icon-badge">
              <i class="fa-regular fa-trash-can"></i>
            </div>

            <h3 class="delete-title">Delete Student</h3>
            <p class="delete-subtitle">Are you sure you want to delete this student?</p>

            <!-- Verification Summary Box -->
            <div class="student-summary-box">
              <div class="summary-row">
                <span class="summary-label">Name</span>
                <span class="colon">:</span>
                <span class="summary-value" id="val-name">-</span>
              </div>
              <div class="summary-row">
                <span class="summary-label">Roll Number</span>
                <span class="colon">:</span>
                <span class="summary-value" id="val-roll">-</span>
              </div>
              <div class="summary-row">
                <span class="summary-label">Class</span>
                <span class="colon">:</span>
                <span class="summary-value" id="val-class">-</span>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="delete-actions">
              <button type="button" class="btn-cancel" id="btn-cancel-delete">
                <span>Cancel</span>
              </button>
              <button type="button" class="btn-delete" id="btn-trigger-delete">
                <i class="fa-regular fa-trash-can"></i>
                <span>Delete</span>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Pop-up Confirmation Modal -->
  <div class="modal-overlay" id="confirm-modal" style="display: none;">
    <div class="modal-card">
      <div class="modal-icon-badge">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h3 class="modal-title">Confirm Deletion</h3>
      <p class="modal-desc">Do you really want to permanently remove this student record? This action cannot be undone.</p>
      
      <div class="modal-actions">
        <button type="button" class="modal-btn-no" id="modal-btn-no">
          <span>No, Keep</span>
        </button>
        <button type="button" class="modal-btn-yes" id="modal-btn-yes">
          <i class="fa-regular fa-trash-can"></i>
          <span>Yes, Delete</span>
        </button>
      </div>
    </div>
  </div>

  <script src="src/js/delete-student.js"></script>
  <script src="src/js/admin-header.js"></script>
</body>
</html>
