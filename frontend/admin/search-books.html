<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Book - Admin Panel</title>
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Admin Search Books CSS -->
  <link rel="stylesheet" href="src/css/search-books.css">
  <link rel="stylesheet" href="src/css/admin-sidebar.css">
</head>
<body>
  <div class="layout-container">
    <!-- Dynamic Sidebar Injection Placeholder -->
    <div id="sidebar-placeholder"></div>

    <!-- ==========================================================================
         MAIN CONTENT WRAPPER
         ========================================================================== -->
    <main class="main-wrapper">
      
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search books by title, author, ISBN or category...">
        </div>

        <div class="header-right">
          <!-- Notification Icon -->
          <div class="notification-btn" title="Notifications" onclick="window.location.href='notifications.html'">
            <i class="fa-regular fa-bell"></i>
            <span class="notification-badge" style="display: none;">0</span>
          </div>

          <!-- User Profile Dropdown -->
          <div class="user-profile">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><circle cx='40' cy='40' r='40' fill='%23F87171'/><circle cx='40' cy='30' r='14' fill='%23FFF0F0'/><path d='M15 68 C15 50, 65 50, 65 68 Z' fill='%23FFF0F0'/></svg>" alt="Admin Avatar" class="user-avatar">
            <div class="user-info">
              <span class="user-name">Admin</span>
            </div>
            <i class="fa-solid fa-chevron-down" style="font-size: 12px; color: #94A3B8;"></i>
          </div>
        </div>
      </header>

      <!-- Main Content Container -->
      <div class="content-container">
        
        <!-- Page Title Header -->
        <div class="page-header-box">
          <div class="page-header-icon">
            <i class="fa-solid fa-book"></i>
          </div>
          <div>
            <h1 class="page-title">Search Book</h1>
            <p class="page-subtitle">Find a book and check its location on the shelf</p>
          </div>
        </div>

        <!-- Search & Filter Card -->
        <div class="filter-card">
          <div class="filter-row-top">
            <div class="filter-input-box">
              <i class="fa-solid fa-magnifying-glass search-icon"></i>
              <input type="text" id="admin-search-input" value="" placeholder="Search by title, author, ISBN or category...">
              <i class="fa-solid fa-xmark clear-icon" id="clear-admin-search"></i>
            </div>
            <button class="btn-search" id="admin-search-btn">
              <i class="fa-solid fa-magnifying-glass"></i>
              <span>Search</span>
            </button>
          </div>

          <div class="filter-row-bottom">
            <select class="filter-select" id="admin-category-select">
              <option value="">All Categories</option>
            </select>

            <select class="filter-select" id="admin-author-select">
              <option value="">All Authors</option>
            </select>

            <select class="filter-select" id="admin-status-select">
              <option value="">All Status</option>
              <option value="Available">Available</option>
              <option value="Issued">Issued</option>
            </select>
          </div>
        </div>

        <!-- Results Split Layout (Left: Search Results, Right: Shelf Location Widget & Map) -->
        <div class="results-split-layout">
          
          <!-- LEFT COLUMN -->
          <div class="left-results-col">
            <div class="section-label" id="admin-results-count">
              Search Results <span>(0 books found)</span>
            </div>

            <!-- Main Selected Book Result Card -->
            <div class="main-book-card" id="admin-main-book-container">
              <!-- Dynamically populated from database -->
            </div>

            <!-- Other Books Found Card -->
            <div class="other-books-card" id="admin-other-books-container">
              <h3 class="other-books-title">Other Books Found</h3>
              <div id="admin-other-books-list">
                <!-- Dynamically populated from database -->
              </div>
            </div>

          </div>

          <!-- RIGHT COLUMN -->
          <div class="right-shelf-col">
            
            <!-- Book Location on Shelf Info Card -->
            <div class="shelf-info-card" id="admin-shelf-info-container">
              <!-- Dynamically populated -->
            </div>

            <!-- Visual Shelf Map Card -->
            <div class="shelf-map-card" id="admin-shelf-map-container">
              <!-- Dynamically populated -->
            </div>

            <!-- Shelf Locator Tip Callout -->
            <div class="shelf-tip-callout" id="admin-shelf-tip-container">
              <!-- Dynamically populated -->
            </div>

          </div>

        </div>

      </div>
    </main>

  </div>

  <!-- Book Details Modal -->
  <div id="admin-book-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; align-items: center; justify-content: center;">
    <div class="modal-card" style="background: #fff; width: 90%; max-width: 600px; border-radius: 16px; padding: 24px; position: relative; max-height: 90vh; overflow-y: auto;">
      <div id="admin-modal-content"></div>
    </div>
  </div>

  <!-- Page Script -->
  <script src="src/js/search-books.js"></script>
  <script src="src/js/shared-sidebar-loader.js"></script>
  <script src="src/js/admin-header.js"></script>
</body>
</html>
