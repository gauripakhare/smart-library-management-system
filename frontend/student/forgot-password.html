<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Library - Forgot Password</title>
    
    <!-- Third-Party Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Linked CSS -->
    <link rel="stylesheet" href="src/css/forgot-password.css">
</head>
<body>

    <div class="login-container" id="resetCard">
        <a href="login.html" class="home-icon-inside" title="Back to Login">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>

        <!-- Brand Header -->
        <div class="brand-header">
            <div class="logo-wrapper">
                <div class="brand-icon-box">
                    <i class="fa-solid fa-key"></i>
                </div>
            </div>
            <h1>CET<span>GURU</span></h1>
            <p><span class="highlight-tag">Reset Password</span> Verification</p>
        </div>

        <!-- Feedback Alert Board -->
        <div id="formFeedbackMessage" class="feedback-board" style="display: none;"></div>

        <form id="forgotPasswordForm" onsubmit="return false;">
            
            <!-- Step 1 & Step 2 Section -->
            <div id="verificationStepSection">
                <div class="step-indicator">Step 1: Verify Email & Receive OTP</div>

                <div class="input-block-container">
                    <div class="input-group">
                        <input type="text" id="recoveryEmail" placeholder="Registered Email or Roll Number" required autocomplete="email">
                        <i class="fa-solid fa-envelope field-icon"></i>
                    </div>
                    <button type="button" class="btn-otp-action" id="btnSendOtp">Send OTP</button>
                </div>

                <div class="input-block-container" id="otpContainer" style="margin-top: 15px;">
                    <div class="input-group">
                        <input type="text" id="otpInput" maxlength="6" placeholder="Enter 6-Digit OTP" required autocomplete="off" disabled>
                        <i class="fa-solid fa-key field-icon"></i>
                    </div>
                    <button type="button" class="btn-otp-action" id="btnVerifyOtp" disabled>Verify OTP</button>
                </div>
            </div>

            <!-- Step 3: New Password Section -->
            <div id="credentialsStepSection" style="display: none; margin-top: 20px;">
                <div class="divider">Step 2: Set New Password</div>

                <div class="input-group">
                    <input type="password" id="newPassword" placeholder="New Password" autocomplete="new-password">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePasswordVisibility('newPassword', this)"></i>
                </div>

                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm New Password" autocomplete="new-password">
                    <i class="fa-solid fa-shield-halved field-icon"></i>
                    <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)"></i>
                </div>
                
                <button type="button" class="btn-login" id="btnChangePassword" style="margin-top: 15px;">
                    <span>Update Password</span>
                    <i class="fa-solid fa-check-circle"></i>
                </button>
            </div>
            
        </form>

        <div class="signup-footer">
            Remembered your password? <a href="login.html">Log In</a>
        </div>
    </div>

    <!-- API Base configuration -->
    <script src="src/js/api-config.js"></script>
    <script src="src/js/forgot-password.js"></script>
</body>
</html>
