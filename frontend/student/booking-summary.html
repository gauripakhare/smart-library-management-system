<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Library - Confirm Reservation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="src/css/sidebar.css">
  <link rel="stylesheet" href="src/css/booking-summary.css">
</head>
<body>
  <div class="layout-container">
    <div id="sidebar-placeholder"></div>

    <div class="main-wrapper">
              <header class="topbar">
          <div class="header-right">
            <div class="notification-btn" id="notif-btn" title="Notifications" onclick="window.location.href='notifications.html'">
              <i class="fa-regular fa-bell"></i>
              <span class="notification-badge" id="notif-badge" style="display: none;">0</span>
            </div>

            <a class="user-profile" href="profile.html" title="View Profile">
              <div class="user-avatar-circle" id="avatar-fallback">GP</div>
              <img src="" alt="" id="student-avatar" class="avatar-img" style="display:none;" />
              <span class="user-name" id="student-name">Gauri Pakhare</span>
              <span id="student-role" hidden>Student</span>
              <i class="fa-solid fa-chevron-down profile-chevron"></i>
            </a>
          </div>
        </header>

      <main class="page-content">
        <!-- Page Title -->
        <section class="booking-header">
          <a href="book-seat.html" class="back-btn" title="Back to Seat Map">
            <i class="fa-solid fa-arrow-left"></i>
          </a>
          <div>
            <h2 class="page-title">Review & Confirm Booking</h2>
            <p class="page-subtitle">Please check your reservation details before confirming.</p>
          </div>
        </section>

        <!-- Stepper: Completed Step 4 -->
        <section class="stepper-container">
          <div class="step-item active">
            <span class="step-circle">1</span>
            <span class="step-label">Select Date & Time</span>
          </div>
          <div class="step-line active"></div>
          <div class="step-item active">
            <span class="step-circle">2</span>
            <span class="step-label">Choose Floor</span>
          </div>
          <div class="step-line active"></div>
          <div class="step-item active">
            <span class="step-circle">3</span>
            <span class="step-label">Select Seat</span>
          </div>
          <div class="step-line active"></div>
          <div class="step-item active">
            <span class="step-circle">4</span>
            <span class="step-label">Confirm</span>
          </div>
        </section>

        <!-- Summary Card Details Container -->
        <div class="summary-wrapper">
          <div class="summary-card">
            <div class="summary-card-header">
              <div class="seat-badge-icon">
                <i class="fa-solid fa-chair"></i>
              </div>
              <div>
                <h3 class="seat-hero-title" id="summary-seat-title">-</h3>
                <span class="status-pill reserved">Ready to Reserve</span>
              </div>
            </div>

            <!-- Detail Attributes Grid -->
            <div class="details-list">
              <div class="detail-row">
                <span class="detail-label"><i class="fa-regular fa-calendar"></i> Date</span>
                <span class="detail-val" id="summary-date">-</span>
              </div>
              <div class="detail-row">
                <span class="detail-label"><i class="fa-regular fa-clock"></i> Start Time</span>
                <span class="detail-val" id="summary-slot">-</span>
              </div>
              <div class="detail-row">
                <span class="detail-label"><i class="fa-solid fa-layer-group"></i> Floor</span>
                <span class="detail-val" id="summary-floor">-</span>
              </div>
              <div class="detail-row">
                <span class="detail-label"><i class="fa-solid fa-hourglass-start"></i> Check-in Window</span>
                <span class="detail-val highlight">15 Minutes from start</span>
              </div>
            </div>

            <!-- Action Buttons: Cancel and Book Seat -->
            <div class="summary-actions">
              <button type="button" class="btn-cancel" id="btn-cancel-summary">
                <i class="fa-solid fa-xmark"></i>
                <span>Cancel</span>
              </button>
              <button type="button" class="btn-book" id="btn-confirm-booking">
                <i class="fa-regular fa-circle-check"></i>
                <span>Book Seat</span>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="src/js/api-config.js"></script>
  <script src="src/js/booking-summary.js"></script>
  <script src="src/js/student-header.js"></script>
</body>
</html>
