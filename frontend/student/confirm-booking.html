<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Library - My Bookings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="src/css/sidebar.css">
  <link rel="stylesheet" href="src/css/confirm-booking.css">
</head>
<body>
  <div class="layout-container">
    <div id="sidebar-placeholder"></div>

    <div class="main-wrapper">
              <header class="topbar">
          <div class="header-right">
            <div class="notification-btn" id="notif-btn" title="Notifications" onclick="window.location.href='notifications.html'">
              <i class="fa-regular fa-bell"></i>
              <span class="notification-badge" id="notif-badge" style="display: none;">0</span>
            </div>

            <a class="user-profile" href="profile.html" title="View Profile">
              <div class="user-avatar-circle" id="avatar-fallback">GP</div>
              <img src="" alt="" id="student-avatar" class="avatar-img" style="display:none;" />
              <span class="user-name" id="student-name">Gauri Pakhare</span>
              <span id="student-role" hidden>Student</span>
              <i class="fa-solid fa-chevron-down profile-chevron"></i>
            </a>
          </div>
        </header>

      <main class="page-content">
        <section class="bookings-header">
          <div class="header-icon">
            <i class="fa-solid fa-user"></i>
          </div>
          <div>
            <h2 class="page-title">My Bookings</h2>
            <p class="page-subtitle">View and manage your seat reservations.</p>
          </div>
        </section>

        <!-- Tabs -->
        <section class="tab-controls">
          <button type="button" class="tab-btn active" id="tab-upcoming">
            <i class="fa-regular fa-calendar"></i>
            <span>Upcoming</span>
            <span class="tab-badge" id="count-upcoming">0</span>
          </button>
          <button type="button" class="tab-btn" id="tab-past">
            <i class="fa-regular fa-clock"></i>
            <span>Past Bookings</span>
            <span class="tab-badge" id="count-past">0</span>
          </button>
        </section>

        <!-- List -->
        <section class="bookings-list" id="bookings-container"></section>
      </main>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="details-modal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Booking Details</h3>
        <button type="button" class="modal-close-btn" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body-content"></div>
    </div>
  </div>

  <script src="src/js/api-config.js"></script>
  <script src="src/js/confirm-booking.js"></script>
  <script src="src/js/student-header.js"></script>
</body>
</html>
